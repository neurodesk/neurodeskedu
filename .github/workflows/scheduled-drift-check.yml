# =============================================================================
# Scheduled corpus drift check
# =============================================================================
# Monthly health check: re-runs the full notebook corpus on a schedule to catch
# upstream package or image drift (e.g. a new package version breaking a
# notebook), and opens a GitHub issue listing anything that fails.
#
# It reuses the corpus pipeline in run_and_publish_notebooks.yml via
# workflow_call (drift_check: true), which forces all notebooks, skips the
# HuggingFace cache-promote so it really re-executes, and does no side effects
# (no HuggingFace upload, no Zenodo DOIs, no Pages deploy).
# =============================================================================

name: Scheduled corpus drift check

on:
  schedule:
    # GitHub cron is UTC and cannot express "first Saturday", so this fires every
    # Saturday 14:00 UTC (Sunday 00:00 Brisbane / AEST) and the guard job below
    # runs the corpus only on the first Saturday of the month.
    - cron: '0 14 * * 6'

  # Manual trigger: lets us smoke-test this workflow (and the image override path)
  # without waiting for the first Saturday. Also useful to re-run a failed drift check.
  workflow_dispatch:
    inputs:
      image_override:
        description: 'Image to test. Default: the newest dated neurodesktop tag on GHCR. A dated tag (YYYY-MM-DD) that passes the whole corpus gets a pin-bump PR.'
        required: false
        type: string
        default: ''

jobs:
  # 1. First-Saturday guard: the cron fires weekly; run the corpus only on the
  #    first Saturday of the month so the cadence is effectively monthly.
  guard:
    name: First-Saturday guard
    runs-on: ubuntu-22.04
    outputs:
      run: ${{ steps.check.outputs.run }}
      image: ${{ steps.image.outputs.image }}
      tag: ${{ steps.image.outputs.tag }}
    steps:
      - id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual dispatch; running the corpus regardless of the date."
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "$(date -u +%-d)" -le 7 ]; then
            echo "First Saturday of the month; running the corpus."
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Not the first Saturday; skipping (monthly cadence)."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      # Decide which image to test. Resolve the newest DATED tag rather than testing
      # :latest, because :latest moves: a pin must name exactly the image that was tested.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        if: ${{ steps.check.outputs.run == 'true' }}
      - id: image
        if: ${{ steps.check.outputs.run == 'true' }}
        env:
          OVERRIDE: ${{ inputs.image_override }}
        run: |
          F=.github/workflows/run_and_publish_notebooks.yml
          PIN=$(sed -nE 's/^[[:space:]]*NEURODESKTOP_VERSION="([0-9-]+)".*/\1/p' "$F" | head -1)
          if [ -n "$OVERRIDE" ]; then
            IMAGE="$OVERRIDE"
          else
            # Fail SOFT: if the registry lookup breaks, test the current pin instead of
            # failing the run (a hard failure here is what took CI down in September).
            TAG=$( (
              TOKEN=$(curl -fsS "https://ghcr.io/token?scope=repository:neurodesk/neurodesktop:pull&service=ghcr.io" \
                | python3 -c 'import sys,json; print(json.load(sys.stdin)["token"])')
              curl -fsS -H "Authorization: Bearer $TOKEN" "https://ghcr.io/v2/neurodesk/neurodesktop/tags/list?n=10000" \
                | python3 -c 'import sys,json,re; t=[x for x in json.load(sys.stdin)["tags"] if re.fullmatch(r"20\d\d-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])", x)]; print(max(t))'
            ) 2>/dev/null ) || TAG=""
            if [ -n "$TAG" ]; then
              IMAGE="ghcr.io/neurodesk/neurodesktop:$TAG"
            else
              echo "::warning::Could not resolve the newest neurodesktop tag; testing the current pin ($PIN). No bump will be proposed."
              IMAGE="ghcr.io/neurodesk/neurodesktop:$PIN"
            fi
          fi
          echo "Testing image: $IMAGE (current pin: $PIN)"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "tag=${IMAGE##*:}" >> "$GITHUB_OUTPUT"

  # 2. Run the full corpus via the reusable workflow, in drift-check mode
  #    (force all, no cache-promote, no side effects).
  corpus:
    name: Corpus
    needs: guard
    if: ${{ needs.guard.outputs.run == 'true' }}
    uses: ./.github/workflows/run_and_publish_notebooks.yml
    with:
      drift_check: true
      # Test the image the guard resolved (newest dated tag, or the dispatch override),
      # not the pinned one. Pushes stay pinned for reproducibility; this monthly run is
      # what catches image drift.
      image_override: ${{ needs.guard.outputs.image }}
    secrets: inherit

  # 3. If anything failed, open or update a single rolling corpus-drift issue.
  report:
    name: Report drift
    needs: [guard, corpus]
    if: ${{ always() && needs.guard.outputs.run == 'true' && needs.corpus.result == 'failure' }}
    runs-on: ubuntu-22.04
    permissions:
      issues: write
      actions: read
    steps:
      - name: Open or update the corpus-drift issue
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        with:
          script: |
            const label = 'corpus-drift';
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const today = new Date().toISOString().slice(0, 10);

            // Ensure the label exists (no-op if it already does).
            try {
              await github.rest.issues.createLabel({ owner, repo, name: label, color: 'B60205', description: 'Scheduled corpus run found drift' });
            } catch (e) { /* already exists */ }

            // Collect the notebooks that failed in this run. Reusable-workflow jobs
            // are named "Corpus / Run Notebook (<path>)", so match anywhere in the name.
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              owner, repo, run_id: context.runId, per_page: 100,
            });
            const notebookJobs = jobs.filter(j => j.name.includes('Run Notebook ('));
            const failed = notebookJobs
              .filter(j => j.conclusion === 'failure')
              .map(j => (j.name.match(/Run Notebook \((.+)\)/) || [null, j.name])[1])
              .sort();
            // A failure BEFORE any notebook runs (e.g. Setup Environment) leaves zero
            // failed notebook jobs, which used to report a useless "0 failing notebooks".
            // Name the job and step that actually failed instead.
            const otherFailed = jobs.filter(j => j.conclusion === 'failure' && !j.name.includes('Run Notebook ('));
            const describe = (j) => {
              const step = (j.steps || []).find(s => s.conclusion === 'failure');
              return step ? j.name + ' -> step: ' + step.name : j.name;
            };
            const list = failed.length
              ? failed.map(n => '- `' + n + '`').join('\n')
              : (otherFailed.length
                  ? otherFailed.map(j => '- `' + describe(j) + '`').join('\n')
                  : '- (no failing job reported; see the run log)');
            const headline = failed.length
              ? `The scheduled monthly corpus run on **${today}** found **${failed.length}** failing notebook(s):`
              : `The scheduled monthly corpus run on **${today}** **failed before any notebook executed**. Failing job(s):`;
            const body = [
              headline,
              '', list, '',
              `Run: ${runUrl}`, '',
              `These are usually upstream package or image drift. Investigate each, pin a known-good version, and re-run.`,
            ].join('\n');
            const title = failed.length ? 'Scheduled corpus drift: notebook(s) failing' : 'Scheduled corpus drift: run failed before notebooks executed';

            // Reuse one rolling open issue to avoid inbox spam.
            const existing = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', labels: label, per_page: 100,
            });
            if (existing.length) {
              const num = existing[0].number;
              await github.rest.issues.update({ owner, repo, issue_number: num, body });
              await github.rest.issues.createComment({ owner, repo, issue_number: num, body: `Re-checked **${today}**: ${failed.length} failing. ${runUrl}` });
              core.notice(`Updated drift issue #${num}`);
            } else {
              const created = await github.rest.issues.create({ owner, repo, title, body, labels: [label] });
              core.notice(`Opened drift issue #${created.data.number}`);
            }

  # 4. If the whole corpus passed on a newer dated tag, open a PR bumping the pin.
  #    Never auto-merges: a human reviews and merges it.
  propose-bump:
    name: Propose pin bump
    needs: [guard, corpus]
    if: ${{ needs.corpus.result == 'success' }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: main
      - name: Open pin-bump PR
        env:
          TAG: ${{ needs.guard.outputs.tag }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          F=.github/workflows/run_and_publish_notebooks.yml
          PIN=$(sed -nE 's/^[[:space:]]*NEURODESKTOP_VERSION="([0-9-]+)".*/\1/p' "$F" | head -1)
          if ! [[ "$TAG" =~ ^20[0-9]{2}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "Tested '$TAG' is not a dated tag; nothing to propose."; exit 0
          fi
          if [[ ! "$TAG" > "$PIN" ]]; then
            echo "Tested $TAG is not newer than the pin ($PIN); nothing to propose."; exit 0
          fi
          BRANCH="chore/bump-neurodesktop-$TAG"
          if git ls-remote --exit-code origin "refs/heads/$BRANCH" >/dev/null 2>&1; then
            echo "$BRANCH already exists; not opening a duplicate PR."; exit 0
          fi
          sed -i -E "s/^([[:space:]]*NEURODESKTOP_VERSION=\")[0-9-]+(\")/\1${TAG}\2/" "$F"
          if git diff --quiet; then echo "::error::Pin line not found or unchanged"; exit 1; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git commit -am "chore: bump neurodesktop pin to $TAG"
          git push origin "$BRANCH"
          BODY="The scheduled drift check ran the full corpus on neurodesktop:$TAG and every notebook passed.

          This bumps NEURODESKTOP_VERSION from $PIN to $TAG.

          Evidence: $RUN_URL"
          gh pr create --base main --head "$BRANCH" --title "chore: bump neurodesktop pin to $TAG" --body "$BODY"
