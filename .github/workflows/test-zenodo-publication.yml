name: Test Zenodo publication

on:
  push:
    paths:
      - '.github/scripts/publish-zenodo.py'
      - '.github/scripts/notebook_metadata.py'
      - '.github/scripts/test_publish_zenodo.py'
      - '.github/scripts/test_notebook_metadata.py'
      - '.github/workflows/test-zenodo-publication.yml'
  pull_request:
    paths:
      - '.github/scripts/publish-zenodo.py'
      - '.github/scripts/notebook_metadata.py'
      - '.github/scripts/test_publish_zenodo.py'
      - '.github/scripts/test_notebook_metadata.py'
      - '.github/workflows/test-zenodo-publication.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'
      - run: python -m pip install pyyaml
      - run: python -m unittest discover -s .github/scripts -p test_publish_zenodo.py -v
      - run: python .github/scripts/test_notebook_metadata.py
