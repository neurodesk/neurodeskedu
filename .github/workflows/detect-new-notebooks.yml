# Detect new notebooks/pages that lack an nd_review_id and automatically:
#   1. Generate a UUID
#   2. Write it into the notebook/page metadata (via PR)
#   3. Open a review issue in the reviews repo with the UUID already set
#
# CI gate: this runs after "Run Notebooks & Publish" finishes on main, not on
# the push itself, and only notebooks whose current version passed CI get
# steps 1-3 (see .github/scripts/review_ci_gate.py). A notebook that failed,
# was cancelled or has not run yet is held back with a warning. It keeps
# lacking an nd_review_id, so the first run after CI passes on main picks it
# up (re-run its failed job on that main run, or push a fix; dispatched CI
# runs do not count). Held notebooks are listed in one rolling "review-held"
# issue in this repo (notice job); only real CI failures tag the author and
# the editor. Skip-listed notebooks are filed as before, without CI.
#
# This is self-contained — no round-trip dispatch needed.
# Only requires one cross-repo token: REVIEWS_REPO_TOKEN (to create issues
# in the reviews repository).

name: Detect new notebooks

on:
  # After CI finishes on main, so the gate can see each notebook's result.
  workflow_run:
    workflows: ['Run Notebooks & Publish']
    types: [completed]
    branches: [main]

  # Previous trigger, which filed review issues without waiting for CI:
  # push:
  #   branches: [main]
  #   paths:
  #     - 'books/**/*.ipynb'

  workflow_dispatch:
    inputs:
      dry_run:
        description: 'List files without creating issues or PRs'
        required: false
        default: false
        type: boolean

jobs:
  detect:
    # Only CI runs triggered by a push to main of this repo count, not dispatched
    # or fork runs.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    # Job-level, so runs skipped by the if above (e.g. after a dispatched CI run)
    # never take a place in the queue. A waiting run can still be replaced by a
    # newer real one, which covers it: it checks out the current default branch
    # and looks back over recent CI runs.
    concurrency:
      group: detect-new-notebooks
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: read  # the CI gate reads job results of "Run Notebooks & Publish"
    outputs:
      # Read by the notice job. held_known is false when the gate could not run
      # (e.g. an API error), so the notice is left as it was.
      held: ${{ steps.find_authors.outputs.held || steps.gate.outputs.held || '[]' }}
      held_known: ${{ steps.gate.outcome == 'success' || steps.scan.outputs.count == '0' }}

    steps:
      # On workflow_run, check out the current default branch, not the CI run's
      # head_sha nor github.sha (both fixed when the event fired). The gate compares
      # each notebook here with the version CI ran, so a notebook changed or deleted
      # since is not filed on an old result, and the auto-inject PR starts from
      # current main.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.repository.default_branch || '' }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Find notebooks without nd_review_id
        id: scan
        run: |
          python - <<'PYEOF'
          import json, os, re, sys, glob, uuid

          # Patterns to skip (intros, templates, contribute pages)
          SKIP_PATTERNS = [
              r'/intro\.md$',
              r'/intro\.ipynb$',
              r'/contribute/',
              r'template\.ipynb$',
          ]

          def should_skip(path):
              for pat in SKIP_PATTERNS:
                  if re.search(pat, path.replace('\\', '/')):
                      return True
              return False

          def has_review_id_ipynb(path):
              try:
                  with open(path, encoding='utf-8') as f:
                      nb = json.load(f)
                  return bool(nb.get('metadata', {}).get('nd_review_id'))
              except Exception:
                  return False

          missing = []
          for path in glob.glob('books/**/*.ipynb', recursive=True):
              if should_skip(path):
                  continue
              rel = path.replace('\\', '/').removeprefix('books/')
              if not has_review_id_ipynb(path):
                  missing.append({'source_path': rel, 'review_id': str(uuid.uuid4())})

          if missing:
              print(f"Found {len(missing)} file(s) without nd_review_id:")
              for item in missing:
                  print(f"  - {item['source_path']} → {item['review_id']}")
          else:
              print("All content files have nd_review_id.")

          with open(os.environ.get('GITHUB_OUTPUT', '/dev/null'), 'a') as f:
              f.write(f"missing={json.dumps(missing)}\n")
              f.write(f"count={len(missing)}\n")
          PYEOF

      # dry_run is a boolean input, so compare against true, not 'true': a boolean
      # never equals a string in expressions, so dry runs used to act for real.
      - name: Verify cross-repo token
        if: fromJSON(steps.scan.outputs.count) > 0 && inputs.dry_run != true
        env:
          HAS_TOKEN: ${{ secrets.REVIEWS_REPO_TOKEN != '' }}
        run: |
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "::error::REVIEWS_REPO_TOKEN is not set. Cannot create issues in the reviews repo."
            exit 1
          fi

      - name: Reconcile UUIDs with existing review issues
        if: fromJSON(steps.scan.outputs.count) > 0 && inputs.dry_run != true
        id: reconcile
        uses: actions/github-script@v7
        env:
          REVIEWS_REPO_OWNER: neurodesk
          REVIEWS_REPO_NAME: neurodeskedu-reviews
          MISSING_JSON: ${{ steps.scan.outputs.missing }}
        with:
          github-token: ${{ secrets.REVIEWS_REPO_TOKEN }}
          script: |
            const missing = JSON.parse(process.env.MISSING_JSON);
            const repoOwner = process.env.REVIEWS_REPO_OWNER;
            const repoName = process.env.REVIEWS_REPO_NAME;
            const reconciled = [];
            // Paths an issue is actually about: its nd-review block's source_path,
            // or the value under the issue form's "Source path" heading. A body that
            // merely mentions the path does not count.
            const pathsOf = (body) => {
              const block = (body.match(/<!--\s*nd-review\s*\n([\s\S]*?)-->/) || [])[1] || '';
              return [
                (block.match(/source_path:\s*(.+)/) || [])[1],
                (body.match(/###\s*Source path \(relative to books\/\)\s*\n+\s*([^\n]+)/) || [])[1],
              ].filter(Boolean).map(p => p.replace(/`/g, '').trim().replace(/^books\//, ''));
            };

            for (const item of missing) {
              let useId = item.review_id;
              let issueExists = false;
              let issueOpen = false;

              try {
                const results = await github.rest.search.issuesAndPullRequests({
                  q: `repo:${repoOwner}/${repoName} "${item.source_path}" in:body is:issue`,
                });

                const match = results.data.items.find(i => pathsOf(i.body || '').includes(item.source_path));
                if (match) {
                  issueExists = true;
                  issueOpen = match.state === 'open';  // only an open issue skips the CI gate
                  const existingBody = match.body || '';
                  const m = existingBody.match(
                    /<!--\s*nd-review\s*\n([\s\S]*?)-->/
                  );
                  if (m) {
                    const rid = (m[1].match(/review_id:\s*(\S+)/) || [])[1];
                    if (rid) {
                      core.info(
                        `Issue already exists for ${item.source_path} ` +
                        `with UUID ${rid} — reusing instead of ${item.review_id}`
                      );
                      useId = rid;
                    }
                  }
                }
              } catch (err) {
                core.warning(
                  `Could not check existing issues for ${item.source_path}: ${err.message}`
                );
              }

              reconciled.push({
                source_path: item.source_path,
                review_id: useId,
                issue_exists: issueExists,
                issue_open: issueOpen,
              });
              await new Promise(r => setTimeout(r, 500));
            }

            core.setOutput('reconciled', JSON.stringify(reconciled));

      # CI gate: every step below works only on what this lets through. A notebook
      # with no review issue yet must have passed CI on its current version; if it
      # has not, it gets neither an issue nor an nd_review_id (an ID without an
      # issue would hide it from every later scan). Notebooks with an open review
      # issue go through for ID injection, and skip-listed ones are filed as before.
      # On dry runs the reconcile step is skipped, so this sees the plain scan list
      # and just reports.
      - name: Hold back notebooks that have not passed CI
        if: fromJSON(steps.scan.outputs.count) > 0
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATES_JSON: ${{ steps.reconcile.outputs.reconciled || steps.scan.outputs.missing }}
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
        run: python .github/scripts/review_ci_gate.py

      - name: Inject UUIDs and create PR
        if: steps.gate.outputs.count > 0 && inputs.dry_run != true
        id: inject
        env:
          GATED_JSON: ${{ steps.gate.outputs.gated }}
        run: |
          python - <<'PYEOF'
          import json, os, re

          missing = json.loads(os.environ['GATED_JSON'])
          modified = []

          for item in missing:
              review_id = item['review_id']
              source_path = item['source_path']
              file_path = f"books/{source_path}"

              if not os.path.exists(file_path):
                  print(f"WARNING: {file_path} not found, skipping.")
                  continue

              if file_path.endswith('.ipynb'):
                  with open(file_path, encoding='utf-8') as f:
                      nb = json.load(f)
                  nb.setdefault('metadata', {})['nd_review_id'] = review_id
                  with open(file_path, 'w', encoding='utf-8') as f:
                      json.dump(nb, f, indent=1, ensure_ascii=False)
                      f.write('\n')
                  modified.append(item)
                  print(f"Injected {review_id} into {file_path}")

          with open(os.environ.get('GITHUB_OUTPUT', '/dev/null'), 'a') as f:
              f.write(f"modified={json.dumps(modified)}\n")
          PYEOF

      - name: Check for existing auto-inject PR
        if: steps.gate.outputs.count > 0 && inputs.dry_run != true
        id: check_pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXISTING=$(gh pr list --state open --json number,url,headRefName --jq '[.[] | select(.headRefName | startswith("review/auto-inject-"))][0].url // empty' 2>/dev/null || true)
          if [ -n "$EXISTING" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            # Warn rather than log quietly: this skip leaves the new notebooks
            # without an nd_review_id, so their pages render no review badge at
            # all. Review issues still get created (that step is not gated), so
            # the only symptom is a missing badge — which went unnoticed for two
            # weeks while an auto-inject PR sat open.
            echo "::warning::An auto-inject PR is already open ($EXISTING) — skipping UUID injection. New notebooks will have NO review badge until it is merged."
            {
              echo "### Review ID injection skipped"
              echo ""
              echo "An auto-inject PR is already open: $EXISTING"
              echo ""
              echo "Merge it, then run this workflow manually (Actions > Detect new notebooks > Run workflow) so the remaining notebooks get their \`nd_review_id\`. Re-running this run would reuse its old checkout."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push branch
        if: steps.gate.outputs.count > 0 && inputs.dry_run != true && steps.check_pr.outputs.skip != 'true'
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="review/auto-inject-$(date +%Y%m%d-%H%M%S)"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -b "$BRANCH"
          git add books/

          if git diff --cached --quiet; then
            echo "No changes to commit."
            echo "pr_created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          COUNT="${{ steps.gate.outputs.count }}"

          git commit -m "Add nd_review_id to ${COUNT} new notebook(s)

          Automatically generated by detect-new-notebooks workflow."

          git push origin "$BRANCH"

          PR_URL=$(gh pr create \
            --title "Add review IDs to ${COUNT} new notebook(s)" \
            --body "Automatically adds \`nd_review_id\` metadata to new notebooks that were merged without one.

          _This PR was created automatically by the detect-new-notebooks workflow._" \
            --base main \
            --head "$BRANCH")

          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"
          echo "pr_created=true" >> "$GITHUB_OUTPUT"

      # Intentionally NOT gated on steps.check_pr.outputs.skip: an open inject
      # PR blocks PR creation (to avoid stacking) but must NOT block issue
      # creation or its prerequisite author lookup (these are gated on CI only,
      # via the gate step's list). The reconcile step handles
      # UUID reuse if a later inject run finds an existing issue for the same
      # source_path. Also looks up authors of held notebooks for the notice
      # job, so it runs on dry runs, and even if inject/PR steps failed (it only
      # reads; filing below still needs every earlier step to succeed).
      - name: Find PR authors for new notebooks
        if: ${{ !cancelled() && steps.gate.outcome == 'success' }}
        id: find_authors
        uses: actions/github-script@v7
        env:
          GATED_JSON: ${{ steps.gate.outputs.gated }}
          HELD_JSON: ${{ steps.gate.outputs.held }}
        with:
          script: |
            const { execFileSync } = require('child_process');
            const reconciled = JSON.parse(process.env.GATED_JSON);
            const held = JSON.parse(process.env.HELD_JSON);
            const enriched = [];

            for (const item of [...reconciled, ...held]) {
              let prAuthor = null;

              if (!item.issue_exists) {
                try {
                  // execFileSync with an argv array — no shell parsing, no injection.
                  const logOutput = execFileSync(
                    'git',
                    ['log', '--diff-filter=A', '--format=%H', '--', `books/${item.source_path}`],
                    { encoding: 'utf-8' }
                  ).trim();

                  // git log is newest-first; the most recent add is the one
                  // being filed now, so take the first line.
                  const addedSha = logOutput
                    .split('\n')
                    .filter(s => s.trim())[0];

                  if (addedSha) {
                    const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      commit_sha: addedSha,
                    });

                    const pr = prs[0];
                    if (pr && pr.user) {
                      const login = pr.user.login;
                      const isBot = pr.user.type === 'Bot' || login.endsWith('[bot]');
                      if (!isBot) {
                        prAuthor = login;
                      } else {
                        core.info(`Skipping bot author ${login} for ${item.source_path}`);
                      }
                    }
                  } else {
                    core.info(`No adding commit found for ${item.source_path}`);
                  }
                } catch (err) {
                  core.warning(`Could not find PR author for ${item.source_path}: ${err.message}`);
                }
              }

              enriched.push({ ...item, pr_author: prAuthor });
            }

            core.setOutput('enriched', JSON.stringify(enriched.slice(0, reconciled.length)));
            core.setOutput('held', JSON.stringify(enriched.slice(reconciled.length)));

      - name: Open review issues in reviews repo
        if: steps.gate.outputs.count > 0 && inputs.dry_run != true
        uses: actions/github-script@v7
        env:
          REVIEWS_REPO_OWNER: neurodesk
          REVIEWS_REPO_NAME: neurodeskedu-reviews
          ENRICHED_JSON: ${{ steps.find_authors.outputs.enriched }}
        with:
          github-token: ${{ secrets.REVIEWS_REPO_TOKEN }}
          script: |
            const enriched = JSON.parse(process.env.ENRICHED_JSON);
            const repoOwner = process.env.REVIEWS_REPO_OWNER;
            const repoName = process.env.REVIEWS_REPO_NAME;
            const failed = [];

            for (const item of enriched) {
              if (item.issue_exists) {
                core.info(
                  `Issue already exists for ${item.source_path} — ` +
                  `UUID ${item.review_id} was reused. Skipping issue creation.`
                );
                continue;
              }

              try {
                const body = [
                  `### Source path (relative to books/)`,
                  ``,
                  item.source_path,
                  ``,
                  `### Notes`,
                  ``,
                  `Automatically opened by the detect-new-notebooks workflow.`,
                  ...(item.ci_skipped ? [``, `This notebook is in .github/skip-notebooks.txt, so CI does not execute it.`] : []),
                  ``,
                  ``,
                  `<!-- nd-review`,
                  `review_id: ${item.review_id}`,
                  `source_path: ${item.source_path}`,
                  `-->`,
                ].join('\n');

                const { data: issue } = await github.rest.issues.create({
                  owner: repoOwner,
                  repo: repoName,
                  title: `Review: ${item.source_path}`,
                  labels: ['review:queued'],
                  body: body,
                });

                core.info(`Created issue #${issue.number} for ${item.source_path}`);

                // Post welcome comment tagging the notebook's PR author
                if (item.pr_author) {
                  try {
                    // Strip backticks from source_path so a malicious filename
                    // can't break out of the inline code span.
                    const safeSourcePath = item.source_path.replace(/`/g, '');
                    const welcomeBody =
                      `🎊 Congrats @${item.pr_author}! Your notebook ` +
                      `\`${safeSourcePath}\` is now part of NeurodeskEDU! ` +
                      `It's currently marked as unreviewed while it waits ` +
                      `for peer review. Know anyone who'd be a good fit to ` +
                      `review it? Someone familiar with the method or tooling ` +
                      `used tends to work best. Drop a name (or a few) below, ` +
                      `and @micmas will take it from there.`;

                    await github.rest.issues.createComment({
                      owner: repoOwner,
                      repo: repoName,
                      issue_number: issue.number,
                      body: welcomeBody,
                    });
                    core.info(
                      `Posted welcome comment on issue #${issue.number} ` +
                      `tagging @${item.pr_author}`
                    );
                  } catch (err) {
                    core.warning(
                      `Welcome comment failed for issue #${issue.number}: ${err.message}`
                    );
                  }
                } else {
                  core.info(
                    `No PR author identified for ${item.source_path} — ` +
                    `skipping welcome comment.`
                  );
                }
              } catch (err) {
                core.warning(
                  `Failed to create issue for ${item.source_path}: ${err.message}`
                );
                failed.push(item.source_path);
              }
              await new Promise(r => setTimeout(r, 1000));
            }

            if (failed.length > 0) {
              core.setFailed(
                `Failed to create ${failed.length} issue(s): ${failed.join(', ')}. ` +
                `Re-run this workflow to retry.`
              );
            }

  # One rolling issue in THIS repo (label review-held) listing held notebooks.
  # It is open while at least one notebook is held because CI failed, was
  # cancelled or timed out; those tag their author and the editor. Notebooks
  # merely waiting for CI are listed without tagging anyone. A comment goes out
  # only when a notebook is newly held for a failure (mentions in edited bodies
  # notify nobody), posted before the body is updated so a failed comment is
  # retried next run. Own job, so a failure here never touches filing and a
  # re-run repeats only this job. Skipped when the held set is unknown (the gate
  # could not run), leaving the notice as it was.
  notice:
    name: Update the review-held notice
    needs: detect
    if: ${{ !cancelled() && needs.detect.outputs.held_known == 'true' }}
    concurrency:
      group: review-held-notice
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open, update or close the notice
        uses: actions/github-script@v7
        env:
          HELD_JSON: ${{ needs.detect.outputs.held }}
          DRY_RUN: ${{ inputs.dry_run == true }}
        with:
          script: |
            const label = 'review-held';
            const editor = 'micmas';
            const bot = 'github-actions[bot]';
            const { owner, repo } = context.repo;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const dryRun = process.env.DRY_RUN === 'true';
            const held = JSON.parse(process.env.HELD_JSON)
              .sort((a, b) => a.source_path.localeCompare(b.source_path));
            const failing = held.filter(h => h.notify);
            const cell = s => String(s).replace(/\|/g, '\\|');
            const code = s => '`' + s.replace(/`/g, '') + '`';
            const who = h => (h.notify && h.pr_author ? `@${h.pr_author}` : '');
            const act = msg => core.notice((dryRun ? 'Dry run, would ' : '') + msg);
            if (dryRun) core.info('Dry run: existing review issues were not checked, so this may list notebooks a real run would not hold.');

            // The marker records which notebooks have been announced. URI-encoded so no
            // path can end the HTML comment early; unreadable means "do not comment".
            const MARK = /<!-- review-held: (\S*) -->/;
            const announced = (body) => {
              try {
                const v = JSON.parse(decodeURIComponent((body || '').match(MARK)[1]));
                return Array.isArray(v) && v.every(p => typeof p === 'string') ? v : null;
              } catch (e) { return null; }
            };
            const body = [
              `<!-- review-held: ${encodeURIComponent(JSON.stringify(failing.map(h => h.source_path)))} -->`,
              'These notebooks have no review issue yet because CI has not passed on their current version on main. Each gets its review issue automatically once it does. Notebooks still waiting for CI are listed without tagging anyone.',
              '',
              '| Notebook | Author | Why | CI |',
              '|---|---|---|---|',
              ...held.map(h => `| ${cell(code(h.source_path))} | ${who(h)} | ${cell(h.reason)} | ${h.url ? `[link](${h.url})` : ''} |`),
              '',
              'To unblock one: push a fix to main, or if it was a flake, re-run its failed job on that main run (possible for 30 days). Dispatched CI runs do not count.',
              '',
              `cc @${editor}`,
            ].join('\n');
            const comment = (n, text) => github.rest.issues.createComment({ owner, repo, issue_number: n, body: text });
            const update = (n, fields) => github.rest.issues.update({ owner, repo, issue_number: n, ...fields });

            // Only issues this workflow opened count: not PRs, not anyone else's issue.
            const notices = (await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'all', labels: label, per_page: 100,
            })).filter(i => !i.pull_request && i.user && i.user.login === bot && MARK.test(i.body || ''))
              .sort((a, b) => b.number - a.number);
            const [notice, ...extras] = notices;
            for (const x of extras.filter(x => x.state === 'open')) {
              act(`close duplicate notice #${x.number}`);
              if (!dryRun) {
                await comment(x.number, `Duplicate of #${notice.number}. Closing.`);
                await update(x.number, { state: 'closed', state_reason: 'not_planned' });
              }
            }

            if (!failing.length) {
              if (!notice || notice.state !== 'open') return core.info('No notebook held for a CI failure; nothing to do.');
              act(`close notice #${notice.number}`);
              if (dryRun) return;
              await comment(notice.number, `No notebook is held for a CI failure any more. Closing. ${runUrl}`);
              await update(notice.number, { body, state: 'closed', state_reason: 'completed' });
              return;
            }

            if (!notice) {
              act(`open a notice for ${failing.length} failing notebook(s)`);
              if (dryRun) return core.info(body);
              try {
                await github.rest.issues.createLabel({ owner, repo, name: label, color: 'FBCA04', description: 'Review issue held until the notebook passes CI on main' });
              } catch (e) { /* already exists */ }
              const { data } = await github.rest.issues.create({ owner, repo, body, labels: [label],
                title: 'Review issues on hold: notebooks not passing CI on main' });
              return core.notice(`Opened notice #${data.number}`);
            }

            const before = announced(notice.body);
            if (!before) core.warning(`Notice #${notice.number} has an unreadable marker; not commenting this run.`);
            const added = before ? failing.filter(h => !before.includes(h.source_path)) : [];
            if (added.length) {
              const mentions = [...new Set(added.map(who).filter(Boolean)), `@${editor}`].join(' ');
              act(`comment on notice #${notice.number}: newly held ${added.map(h => h.source_path).join(', ')}`);
              if (!dryRun) await comment(notice.number,
                `Newly held: ${added.map(h => code(h.source_path)).join(', ')}. ${mentions} ${runUrl}`);
            }
            if (notice.state !== 'open' || notice.body !== body) {
              act(`${notice.state !== 'open' ? 'reopen' : 'update'} notice #${notice.number}`);
              if (!dryRun) await update(notice.number, notice.state === 'open' ? { body } : { body, state: 'open' });
            }
