# Generate the review registry (reviews.json) from the reviews repo issues.
# Runs on a schedule, on dispatch from the reviews repo, or manually.

name: Generate Review Registry

on:
  # Safety net: the repository_dispatch below is the only automatic path, and it
  # fails silently when the sender's token loses access (the sender swallows the
  # error). A periodic pull keeps the registry fresh even when that happens.
  # Writes to the ci-data branch, so this no longer commits to main.
  schedule:
    - cron: '0 */6 * * *'

  # Run when dispatched from the reviews repo
  repository_dispatch:
    types: [reviews-updated]

  # Or manually
  workflow_dispatch:

concurrency:
  group: generate-reviews
  cancel-in-progress: true

jobs:
  generate:
    if: github.repository == 'neurodesk/neurodeskedu'
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.15'

      - name: Generate review registry
        env:
          GITHUB_TOKEN: ${{ secrets.REVIEWS_REPO_TOKEN }}
        run: |
          python tools/generate_reviews_registry.py \
            --reviews-repo neurodesk/neurodeskedu-reviews \
            --out books/_static/reviews.json \
            --repo-dir .

      - name: Push reviews.json to ci-data branch
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cp books/_static/reviews.json /tmp/reviews.json
          if git fetch origin ci-data 2>/dev/null; then
            git checkout ci-data
          else
            # First run: create orphan branch with no history
            git checkout --orphan ci-data
            git rm -rf . > /dev/null 2>&1 || true
          fi
          cp /tmp/reviews.json reviews.json
          git add reviews.json
          if git diff --cached --quiet; then
            echo "No changes to reviews.json"
          else
            git commit -m "chore: update reviews.json"
            git pull --rebase origin ci-data 2>/dev/null || true
            git push origin ci-data
          fi
