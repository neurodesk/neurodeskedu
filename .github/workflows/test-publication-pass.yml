name: Test notebook publication pass

on:
  pull_request:
    paths:
      - '.github/scripts/execute_notebook.py'
      - '.github/scripts/test_publication_pass.py'
      - '.github/workflows/run_and_publish_notebooks.yml'
      - '.github/workflows/test-publication-pass.yml'
      - 'books/examples/structural_imaging/freesurfer.ipynb'
      - 'books/examples/structural_imaging/SYNcro.ipynb'
  push:
    branches: [main]
    paths:
      - '.github/scripts/execute_notebook.py'
      - '.github/scripts/test_publication_pass.py'
      - '.github/workflows/run_and_publish_notebooks.yml'
      - '.github/workflows/test-publication-pass.yml'
      - 'books/examples/structural_imaging/freesurfer.ipynb'
      - 'books/examples/structural_imaging/SYNcro.ipynb'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.15'
      - run: python -m pip install nbclient nbformat ipykernel nibabel numpy
      - run: python .github/scripts/test_publication_pass.py
